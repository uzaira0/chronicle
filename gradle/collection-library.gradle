// Shared build convention for Chronicle collection Android libraries. Modules keep
// their namespace and feature dependencies locally; this file owns only identical
// toolchain, lint, desugaring, and baseline test configuration. Repository policy
// remains centralized in the root allprojects block.

android {
    compileSdk = 36

    defaultConfig {
        minSdk = 23
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        targetCompatibility 17
        sourceCompatibility 17
    }

    lint {
        abortOnError true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
