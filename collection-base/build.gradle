import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.library'
    id 'com.google.devtools.ksp' version '2.3.7'
}

apply from: rootProject.file('gradle/collection-library.gradle')

android {
    namespace 'com.openlattice.chronicle.collection.base'

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
            allWarningsAsErrors = true
        }
    }
}

// Room reads and rewrites the exported ChronicleDb/<version>.json. One directory for every
// variant let kspDebugKotlin and kspReleaseKotlin, which run in parallel in one invocation, read
// each other's half-written file ("Unexpected JSON token ... EOF"). Each KSP task gets its own.
class RoomSchemaLocation implements CommandLineArgumentProvider {
    @OutputDirectory
    final File directory

    RoomSchemaLocation(File directory) { this.directory = directory }

    @Override
    Iterable<String> asArguments() { ["room.schemaLocation=${directory.path}".toString()] }
}

tasks.withType(com.google.devtools.ksp.gradle.KspAATask).configureEach { task ->
    task.commandLineArgumentProviders.add(new RoomSchemaLocation(file("$buildDir/room-schemas/${task.name}")))
}

dependencies {
    // Pure contract layer (tranche 7 split): shared constants, contract-facing sensor
    // types/mappings, settings/policy prefs, and upload payload DTOs. Exposed via `api`
    // so downstream modules keep resolving those packages transitively through
    // :collection-base exactly as before the split.
    api project(':collection-contracts')

    // Internal queue splitting and lossless quarantine serialization.
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.2'

    api('com.openlattice:chronicle-models:0.1.0-SNAPSHOT') {
        exclude module: 'guava'
        exclude group: 'org.apache.olingo'
        exclude module: 'slf4j-api'
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
        exclude group: 'com.fasterxml.jackson.datatype'
        exclude group: 'com.fasterxml.jackson.module'
        exclude group: 'com.fasterxml.jackson.dataformat'
        exclude group: 'jakarta.validation'
    }

    // androidx.security (EncryptedPrefsHelper) moved to :collection-contracts with the
    // preferences layer; :collection-base keeps only the Room/SQLCipher storage stack.
    api 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    api 'net.zetetic:sqlcipher-android:4.13.0'
    api 'androidx.sqlite:sqlite-ktx:2.6.2'
    api 'androidx.room:room-runtime:2.8.4'
    api 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'

    // AndroidJUnitRunner (testInstrumentationRunner) lives in androidx.test:runner;
    // neither ext:junit nor room-testing brings it transitively (room-testing only
    // pulls androidx.test:monitor), so the test APK can't start without it.
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
