tasks.register('verifyPublicRestrictedDependencyBoundary') {
    group = 'verification'
    description = 'Fails if a public Play/Amazon graph resolves an excluded collector project.'
    doLast {
        def excludedProjects = [
            ':collection-sensors',
            ':collection-interaction',
            ':collection-audio',
            ':collection-activity',
            ':collection-health',
        ] as Set
        def publicConfigurations = [
            'playReleaseCompileClasspath',
            'playReleaseRuntimeClasspath',
            'amazonReleaseCompileClasspath',
            'amazonReleaseRuntimeClasspath',
        ]
        def violations = publicConfigurations.collectMany { configurationName ->
            configurations.getByName(configurationName).incoming.resolutionResult.allComponents
                .findAll { component ->
                    component.id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier &&
                        excludedProjects.contains(component.id.projectPath)
                }
                .collect { "${configurationName}:${it.id.projectPath}" }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Public distribution resolved excluded collector code: ${violations}")
        }
    }
}

tasks.register('verifyAmazonRuntimeClasspath') {
    group = 'verification'
    description = 'Fails if the Amazon runtime classpath links Google Play Services or Health Connect.'
    doLast {
        def forbidden = configurations.amazonReleaseRuntimeClasspath.incoming.resolutionResult.allComponents
            .collect { it.moduleVersion }
            .findAll { version ->
                version != null && (
                    version.group == 'com.google.android.gms' ||
                    (version.group == 'androidx.health.connect' && version.name == 'connect-client')
                )
            }
        if (!forbidden.isEmpty()) {
            throw new GradleException("Amazon runtime contains forbidden Google dependencies: ${forbidden}")
        }
    }
}

tasks.register('verifyNoJacksonRuntime') {
    group = 'verification'
    description = 'Fails if a release flavor ships Jackson parser, databind, or datatype code.'
    doLast {
        def allowed = [
            'com.fasterxml.jackson.core:jackson-annotations',
            'com.fasterxml.jackson:jackson-bom',
        ] as Set
        def forbidden = ['playReleaseRuntimeClasspath', 'amazonReleaseRuntimeClasspath', 'researchReleaseRuntimeClasspath']
            .collectMany { configurationName ->
                configurations.getByName(configurationName).incoming.resolutionResult.allComponents
                    .collect { it.moduleVersion }
            }
            .findAll { version ->
                version != null &&
                    version.group.startsWith('com.fasterxml.jackson') &&
                    !allowed.contains("${version.group}:${version.name}".toString())
            }
            .collect { "${it.group}:${it.name}:${it.version}" }
            .toSet()
            .sort()
        if (!forbidden.isEmpty()) {
            throw new GradleException("Android runtime contains forbidden Jackson code: ${forbidden}")
        }
    }
}

tasks.register('generateRuntimeSbom') {
    group = 'verification'
    description = 'Writes a CycloneDX inventory for all release distribution runtime classpaths.'
    dependsOn tasks.named('verifyNoJacksonRuntime')
    def outputFile = layout.buildDirectory.file('reports/security/chronicle-android-runtime.cdx.json')
    outputs.file(outputFile)
    doLast {
        def coordinates = ['playReleaseRuntimeClasspath', 'amazonReleaseRuntimeClasspath', 'researchReleaseRuntimeClasspath']
            .collectMany { configurationName ->
                configurations.getByName(configurationName).incoming.resolutionResult.allComponents
                    .collect { it.moduleVersion }
            }
            .findAll { it != null }
            .collect { "${it.group}:${it.name}:${it.version}" }
            .toSet()
            .sort()
        def components = coordinates.collect { coordinate ->
            def parts = coordinate.split(':', 3)
            [
                type: 'library',
                group: parts[0],
                name: parts[1],
                version: parts[2],
                purl: "pkg:maven/${parts[0]}/${parts[1]}@${parts[2]}",
            ]
        }
        def sbom = [
            bomFormat: 'CycloneDX',
            specVersion: '1.5',
            serialNumber: "urn:uuid:${UUID.nameUUIDFromBytes(coordinates.join('\n').getBytes('UTF-8'))}",
            version: 1,
            metadata: [component: [type: 'application', name: 'chronicle-android', version: android.defaultConfig.versionName]],
            components: components,
        ]
        def destination = outputFile.get().asFile
        destination.parentFile.mkdirs()
        destination.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(sbom))
        logger.lifecycle("Wrote ${components.size()} components to ${destination}")
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyAmazonRuntimeClasspath')
    dependsOn tasks.named('verifyNoJacksonRuntime')
    dependsOn tasks.named('verifyPublicRestrictedDependencyBoundary')
}
