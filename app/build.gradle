def requiresReleaseSigning = gradle.startParameter.taskNames.any { taskName ->
    def normalized = taskName.toLowerCase(Locale.ROOT)
    (normalized.contains('release') || normalized.contains('dogfood')) && (
        normalized.contains('assemble') ||
        normalized.contains('bundle') ||
        normalized.contains('package') ||
        normalized.contains('install')
    )
}


def signingProperties = new Properties()
def signingPropertiesPath = providers.gradleProperty('chronicleSigningProperties')
    .orElse(providers.environmentVariable('CHRONICLE_SIGNING_PROPERTIES'))
    .getOrElse('signing.properties')
def signingPropertiesFile = file(signingPropertiesPath)
def hasChronicleSigning = requiresReleaseSigning && signingPropertiesFile.exists()
if (hasChronicleSigning) {
    signingProperties.load(new FileInputStream(signingPropertiesFile))
}

def readOperatorConfigValue = { String envKey, String gradleProperty, String defaultValue ->
    def envValue = providers.environmentVariable(envKey).getOrNull()
    if (envValue != null && !envValue.isBlank()) return envValue.trim()
    def propValue = project.findProperty(gradleProperty)?.toString()
    if (propValue != null && !propValue.isBlank()) return propValue.trim()
    return defaultValue
}

def quoteBuildConfigString = { String value ->
    "\"${value.replace('\\', '\\\\').replace('"', '\\"')}\""
}

def approvedModuleRegistries = ['AMAZON', 'OPEN'].collectEntries { distribution ->
    def registry = file("src/${distribution.toLowerCase(Locale.ROOT)}/assets/approved-module-registry.json")
    if (!registry.isFile()) {
        throw new GradleException("${distribution} approved-module registry is missing: ${registry}")
    }
    def document
    try {
        document = new groovy.json.JsonSlurper().parse(registry)
    } catch (Exception error) {
        throw new GradleException("${distribution} approved-module registry is invalid JSON", error)
    }
    if (document.schemaVersion != 1 ||
        document.distribution != distribution ||
        !(document.modules instanceof List) ||
        document.modules.isEmpty()) {
        throw new GradleException("${distribution} approved-module registry has an invalid schema or distribution")
    }
    def moduleIds = document.modules.collect { module -> module.id?.toString()?.trim() }
    if (moduleIds.any { !(it ==~ /[a-z][a-z0-9_]*/) } ||
        moduleIds.toSet().size() != moduleIds.size()) {
        throw new GradleException("${distribution} approved-module registry contains an invalid or duplicate module id")
    }
    def requiredRegistryKeys = ['fields', 'permissions', 'retention', 'destinations', 'upload', 'deletion']
    if (document.modules.any { module ->
        requiredRegistryKeys.any { key -> !module.containsKey(key) }
    }) {
        throw new GradleException("${distribution} approved-module registry omits a required module contract field")
    }
    def sha256 = java.security.MessageDigest.getInstance('SHA-256')
        .digest(registry.bytes)
        .collect { String.format('%02x', it) }
        .join('')
    [(distribution): [ids: moduleIds.join(','), sha256: sha256]]
}
def releaseCandidateId = providers.gradleProperty('chronicleRcId')
    .orElse(providers.environmentVariable('CHRONICLE_RC_ID'))
    .getOrElse('UNSEALED')
    .trim()
if (!(releaseCandidateId ==~ /[A-Za-z0-9][A-Za-z0-9._-]{0,127}/)) {
    throw new GradleException('CHRONICLE_RC_ID/chronicleRcId must be 1-128 safe identifier characters')
}

def normalizedSigningPath = { Object value ->
    value == null ? '' : value.toString().trim().replace('\\', '/').toLowerCase(Locale.ROOT)
}

def isDebugSigningMaterial = { Properties properties ->
    def storePath = normalizedSigningPath(properties['storeFile'])
    def keyAlias = properties['keyAlias']?.toString()?.trim()?.toLowerCase(Locale.ROOT) ?: ''
    def storePassword = properties['storePassword']?.toString()
    def keyPassword = properties['keyPassword']?.toString()

    keyAlias == 'androiddebugkey' ||
        storePath == 'debug.keystore' ||
        storePath.endsWith('/debug.keystore') ||
        storePassword == 'android' ||
        keyPassword == 'android'
}

def chronicleProductionHost = readOperatorConfigValue(
    'CHRONICLE_PRODUCTION_HOST',
    'chronicleProductionHost',
    ''
)

// Research inherits ALLOW_ANY_SERVER=false and trusts only this host, so an APK built with a
// blank host rejects every server. BuildConfig generation alone (guardrail scripts) is allowed.
def requiresResearchArtifact = gradle.startParameter.taskNames.any { taskName ->
    def normalized = taskName.toLowerCase(Locale.ROOT)
    normalized.contains('research') && ['assemble', 'bundle', 'package', 'install'].any { normalized.contains(it) }
}
if (requiresResearchArtifact && chronicleProductionHost.isBlank()) {
    throw new GradleException('CHRONICLE_PRODUCTION_HOST (or -PchronicleProductionHost) is required for research builds')
}

android {

    compileSdk = 36
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    defaultConfig {
        applicationId "com.bcm.chronicle"
        minSdk = 26
        targetSdk = 36
        versionCode 85
        versionName "2026.11.05-internal.open.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        // Distributed apps are public clients and must not embed a global server secret.
        buildConfigField "String", "CHRONICLE_PRODUCTION_HOST", quoteBuildConfigString(chronicleProductionHost)
        // Public distribution flavors opt in when participants may enroll against any public
        // HTTPS Chronicle server. The controlled research flavor remains allowlist-pinned.
        buildConfigField "boolean", "ALLOW_ANY_SERVER", "false"
        buildConfigField "boolean", "HAS_APP_NETWORK_USAGE", "false"
        buildConfigField "boolean", "ALLOW_PARTICIPANT_FORM_REMINDERS", "true"
        buildConfigField "String", "RELEASE_CANDIDATE_ID", quoteBuildConfigString(releaseCandidateId)
        buildConfigField "String", "APPROVED_MODULE_REGISTRY_SHA256", quoteBuildConfigString(approvedModuleRegistries.AMAZON.sha256)
        buildConfigField "String", "AMAZON_APPROVED_MODULE_IDS", quoteBuildConfigString(approvedModuleRegistries.AMAZON.ids)
        buildConfigField "String", "DISTRIBUTION_APPROVED_MODULE_IDS", quoteBuildConfigString(approvedModuleRegistries.AMAZON.ids)
        manifestPlaceholders += [
            releaseCandidateId: releaseCandidateId,
            approvedModuleRegistrySha256: approvedModuleRegistries.AMAZON.sha256,
        ]
    }
    flavorDimensions += "distribution"
    productFlavors {
        amazon {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION_CHANNEL", '"AMAZON"'
            buildConfigField "boolean", "HAS_GOOGLE_SERVICES", "false"
            buildConfigField "boolean", "HAS_HEALTH_CONNECT", "false"
            buildConfigField "boolean", "ALLOW_RESTRICTED_RESEARCH_PERMISSIONS", "false"
            buildConfigField "boolean", "DIRECT_BATTERY_EXEMPTION_REQUEST", "false"
            buildConfigField "boolean", "ALLOW_PARTICIPANT_FORM_REMINDERS", "false"
            buildConfigField "boolean", "ALLOW_ANY_SERVER", "true"
            buildConfigField "String", "CHRONICLE_PRODUCTION_HOST", '""'
        }
        research {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION_CHANNEL", '"RESEARCH"'
            buildConfigField "String", "DISTRIBUTION_APPROVED_MODULE_IDS", '""'
            buildConfigField "boolean", "HAS_GOOGLE_SERVICES", "true"
            buildConfigField "boolean", "HAS_HEALTH_CONNECT", "true"
            buildConfigField "boolean", "ALLOW_RESTRICTED_RESEARCH_PERMISSIONS", "true"
            buildConfigField "boolean", "DIRECT_BATTERY_EXEMPTION_REQUEST", "true"
            buildConfigField "boolean", "HAS_APP_NETWORK_USAGE", "true"
        }
        // Play ships the open artifact. Its registry limits the enabled collectors while
        // the sensor service stays available without accessibility, notification or audio collectors.
        // Participants may enroll against any public HTTPS Chronicle backend.
        open {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION_CHANNEL", '"OPEN"'
            buildConfigField "String", "DISTRIBUTION_APPROVED_MODULE_IDS", quoteBuildConfigString(approvedModuleRegistries.OPEN.ids)
            buildConfigField "String", "APPROVED_MODULE_REGISTRY_SHA256", quoteBuildConfigString(approvedModuleRegistries.OPEN.sha256)
            manifestPlaceholders += [approvedModuleRegistrySha256: approvedModuleRegistries.OPEN.sha256]
            buildConfigField "boolean", "HAS_GOOGLE_SERVICES", "true"
            buildConfigField "boolean", "HAS_HEALTH_CONNECT", "false"
            buildConfigField "boolean", "ALLOW_RESTRICTED_RESEARCH_PERMISSIONS", "true"
            buildConfigField "boolean", "DIRECT_BATTERY_EXEMPTION_REQUEST", "false"
            buildConfigField "boolean", "HAS_APP_NETWORK_USAGE", "true"
            buildConfigField "boolean", "ALLOW_ANY_SERVER", "true"
            buildConfigField "String", "CHRONICLE_PRODUCTION_HOST", '""'
        }
    }
    sourceSets {
        test.resources.srcDir "../collection-base/schemas"
        debug.assets.srcDir "../collection-base/schemas"
        test.resources.srcDir rootProject.file('store/play')
        research.java.srcDir 'src/googleServices/java'
        research.kotlin.srcDir 'src/googleServices/java'
        research.res.srcDir 'src/googleServices/res'
        open.java.srcDir 'src/googleServices/java'
        open.kotlin.srcDir 'src/googleServices/java'
        open.res.srcDir 'src/googleServices/res'
        def openSyncSource = 'src/amazon/java/com/openlattice/chronicle/services/sync'
        open.java.srcDir openSyncSource
        open.kotlin.srcDir openSyncSource
        amazon.kotlin.srcDir 'src/amazon/java'
        ['testOpen', 'testResearch'].each {
            maybeCreate(it).kotlin.srcDir 'src/testGoogleServices/java'
        }
    }
    signingConfigs {
        chronicle {
            if (hasChronicleSigning) {
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            // Android's built-in pseudolocales (Settings > Developer options > Languages, or
            // `adb shell settings put system system_locales en-XA`): every resource string is
            // accented (en-XA) or mirrored (ar-XB), so text that stays plain English on screen
            // is hardcoded.
            pseudoLocalesEnabled true
            if (hasChronicleSigning) {
                signingConfig signingConfigs.chronicle
            }
        }
        release {
            // The Amazon artifact is minimized so research collectors are absent from its source
            // and dependency graphs. The release verifier
            // proves the reflective/wire/JNI keep rules and rejects excluded descriptors.
            minifyEnabled true
            shrinkResources true
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasChronicleSigning) {
                signingConfig signingConfigs.chronicle
            }
        }
        dogfood {
            initWith release
            matchingFallbacks = ['release']
            debuggable false
            if (hasChronicleSigning) {
                signingConfig signingConfigs.chronicle
            }
        }
        debugMinified {
            initWith debug
            applicationIdSuffix ".debug"
            matchingFallbacks = ['debug']
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable true
            if (hasChronicleSigning) {
                signingConfig signingConfigs.chronicle
            }
        }
        releaseMinified {
            initWith release
            matchingFallbacks = ['release']
            // Release R8, resource shrinking and signing under its own application id, so the release
            // configuration runs on a device next to an installed store build.
            applicationIdSuffix ".drill"
        }
    }
    // Merge the shared permission above each existing flavor manifest, never into stores.
    buildTypes.all { buildType ->
        ['research', 'open'].each { flavor ->
            sourceSets.maybeCreate("${flavor}${buildType.name.capitalize()}").manifest.srcFile(
                'src/googleServices/AndroidManifest.xml'
            )
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        targetCompatibility 17
        sourceCompatibility 17
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
            allWarningsAsErrors = true
        }
    }

    testOptions {
        unitTests {
            // Layout screenshot tests (src/testOpen/.../layout) render real resources.
            includeAndroidResources = true
            // Plain JVM tests reach android.util.Log in collection code; stubs return defaults.
            returnDefaultValues = true
            all {
                // Contract tests read checkout files in addition to their compiled classpath.
                inputs.files(rootProject.fileTree(rootProject.projectDir) {
                    include 'app/src/**', 'collection-*/src/**', 'collection-base/schemas/**'
                    include 'app/build.gradle', 'app/proguard-rules.pro', 'scripts/**'
                    include 'store/*/privacy.properties', 'store/*/*.md'
                }).withPropertyName('contractFiles').withPathSensitivity(PathSensitivity.RELATIVE)
                def handoffFixture = providers.environmentVariable('CHRONICLE_ENROLLMENT_HANDOFF_FIXTURE')
                inputs.property('enrollmentHandoffFixture', handoffFixture.orElse('classpath'))
                if (handoffFixture.isPresent()) {
                    inputs.file(handoffFixture.get()).withPropertyName('enrollmentHandoffFixtureFile')
                        .withPathSensitivity(PathSensitivity.NONE)
                    systemProperty('com.openlattice.chronicle.EnrollmentHandoffUriTest', handoffFixture.get())
                }
                systemProperty 'robolectric.pixelCopyRenderMode', 'hardware'
                // Pin locale data for date assertions and native screenshot number formatting.
                systemProperty 'java.locale.providers', 'CLDR'
                // Gradle's 512m default runs Robolectric's cached SDK resources out of heap.
                maxHeapSize = '2g'
                // Robolectric reaches into these JDK internals; JDK 17+ needs them opened.
                jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED',
                        '--add-opens=java.base/java.lang=ALL-UNNAMED',
                        '--add-opens=java.base/java.util=ALL-UNNAMED',
                        '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
            }
        }
    }

    lint {
        abortOnError true
        // HardcodedText is promoted to an error in lint.xml (see app/src/main/res/I18N.md).
        lintConfig file('lint.xml')
    }
    namespace 'com.openlattice.chronicle'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.hostTests.values().each { hostTest ->
            hostTest.configureTestTask { task ->
                def manifest = variant.artifacts.get(SingleArtifact.MERGED_MANIFEST.INSTANCE)
                task.inputs.file(manifest)
                    .withPropertyName('mergedManifest').withPathSensitivity(PathSensitivity.RELATIVE)
                task.systemProperty('com.openlattice.chronicle.audit.ManifestReceiverAuditTest',
                    manifest.get().asFile.absolutePath)
            }
        }

    }
}

if (requiresReleaseSigning && !hasChronicleSigning) {
    throw new GradleException(
        "Chronicle release builds require app/signing.properties and its configured keystore."
    )
}

if (requiresReleaseSigning && hasChronicleSigning) {
    def configuredStore = file(signingProperties['storeFile'] ?: '')
    if (!configuredStore.exists()) {
        throw new GradleException(
            "Chronicle release signing keystore does not exist: ${configuredStore}"
        )
    }
    if (isDebugSigningMaterial(signingProperties)) {
        throw new GradleException(
            "Chronicle release builds must not use Android debug signing material. " +
                "Configure app/signing.properties with the intended non-debug Chronicle release/beta keystore."
        )
    }
}

def verifyAndroid16kbScript = rootProject.file('scripts/verify-android-16kb-native-libs.sh')
def distributionFlavors = ['amazon', 'research', 'open']
def verifiableBuildTypes = ['debug', 'release', 'dogfood', 'debugMinified', 'releaseMinified']
distributionFlavors.each { flavorName ->
    verifiableBuildTypes.each { buildTypeName ->
        def variantName = "${flavorName}${buildTypeName.capitalize()}"
        def variantTaskSuffix = variantName.capitalize()
        def apkFile = file(
            "${buildDir}/outputs/apk/${flavorName}/${buildTypeName}/" +
                "app-${flavorName}-${buildTypeName}.apk"
        )
        def verifyTask = tasks.register("verify${variantTaskSuffix}16kbNativeLibs", Exec) {
            group = 'verification'
            description = "Verifies ${apkFile.name} is 16 KB native-library compatible."
            inputs.file(apkFile)
            def verifierArgs = [verifyAndroid16kbScript.absolutePath]
            if (buildTypeName in ['release', 'dogfood', 'releaseMinified']) {
                verifierArgs.add('--release-abis-only')
            }
            verifierArgs.add(apkFile.absolutePath)
            commandLine verifierArgs
        }
        afterEvaluate {
            tasks.named("assemble${variantTaskSuffix}").configure {
                finalizedBy verifyTask
            }
        }
    }
}

