tasks.register('verifyPublicRestrictedDependencyBoundary') {
    group = 'verification'
    description = 'Fails if a public graph resolves a collector project its flavor does not ship.'
    doLast {
        def googleCollectors = [':collection-activity', ':collection-health']
        def amazonExcluded = [':collection-sensors', ':collection-interaction', ':collection-audio'] + googleCollectors
        def excludedByConfiguration = [
            amazonReleaseCompileClasspath: amazonExcluded,
            amazonReleaseRuntimeClasspath: amazonExcluded,
            openReleaseCompileClasspath: amazonExcluded - [':collection-sensors'],
            openReleaseRuntimeClasspath: amazonExcluded - [':collection-sensors'],
        ]
        def violations = excludedByConfiguration.collectMany { configurationName, excludedProjects ->
            configurations.getByName(configurationName).incoming.resolutionResult.allComponents
                .findAll { component ->
                    component.id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier &&
                        excludedProjects.contains(component.id.projectPath)
                }
                .collect { "${configurationName}:${it.id.projectPath}" }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Public distribution resolved excluded collector code: ${violations}")
        }
    }
}

tasks.register('verifyNoGoogleSdkRuntime') {
    group = 'verification'
    description = 'Fails if the Amazon or open runtime classpath links Google Play Services or Health Connect.'
    doLast {
        def forbidden = ['amazonReleaseRuntimeClasspath', 'openReleaseRuntimeClasspath'].collectMany { configurationName ->
            configurations.getByName(configurationName).incoming.resolutionResult.allComponents
                .collect { it.moduleVersion }
                .findAll { version ->
                    version != null && (
                        version.group == 'com.google.android.gms' ||
                        (version.group == 'androidx.health.connect' && version.name == 'connect-client')
                    )
                }
                .collect { "${configurationName}:${it}" }
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("Public runtime contains forbidden Google dependencies: ${forbidden}")
        }
    }
}

def releaseRuntimeClasspaths = ['amazonReleaseRuntimeClasspath', 'researchReleaseRuntimeClasspath', 'openReleaseRuntimeClasspath']

// What ships is pinned in app/gradle.lockfile: a release classpath that resolves to anything else
// fails the build, and osv-scanner reads the lockfile. After a dependency change:
//   ./gradlew :app:verifyNoJacksonRuntime --write-locks
configurations.matching { it.name in releaseRuntimeClasspaths }.configureEach {
    resolutionStrategy.activateDependencyLocking()
    // The app ships Guava's -android line. Research's kotlinx-coroutines-guava asks for -jre, which
    // outranks -android at the same version number.
    resolutionStrategy.eachDependency(rootProject.guavaAndroidResolveRule)
}

tasks.register('verifyNoJacksonRuntime') {
    group = 'verification'
    description = 'Fails if a release flavor ships Jackson parser, databind, or datatype code.'
    doLast {
        def allowed = [
            'com.fasterxml.jackson.core:jackson-annotations',
            'com.fasterxml.jackson:jackson-bom',
        ] as Set
        def forbidden = releaseRuntimeClasspaths
            .collectMany { configurationName ->
                configurations.getByName(configurationName).incoming.resolutionResult.allComponents
                    .collect { it.moduleVersion }
            }
            .findAll { version ->
                version != null &&
                    version.group.startsWith('com.fasterxml.jackson') &&
                    !allowed.contains("${version.group}:${version.name}".toString())
            }
            .collect { "${it.group}:${it.name}:${it.version}" }
            .toSet()
            .sort()
        if (!forbidden.isEmpty()) {
            throw new GradleException("Android runtime contains forbidden Jackson code: ${forbidden}")
        }
    }
}

def runtimeComponents = { List<String> configurationNames ->
    configurationNames
        .collectMany { configurationName ->
            configurations.getByName(configurationName).incoming.resolutionResult.allComponents
                .collect { it.moduleVersion }
        }
        .findAll { it != null }
        .collect { "${it.group}:${it.name}:${it.version}" }
        .toSet()
        .sort()
}

def writeCycloneDx = { File destination, List<String> coordinates, File artifact = null ->
    def components = coordinates.collect { coordinate ->
        def parts = coordinate.split(':', 3)
        [
            type: 'library',
            group: parts[0],
            name: parts[1],
            version: parts[2],
            purl: "pkg:maven/${parts[0]}/${parts[1]}@${parts[2]}",
        ]
    }
    def sbom = [
        bomFormat: 'CycloneDX',
        specVersion: '1.5',
        serialNumber: "urn:uuid:${UUID.nameUUIDFromBytes(coordinates.join('\n').getBytes('UTF-8'))}",
        version: 1,
        metadata: [component: [type: 'application', name: 'chronicle-android', version: android.defaultConfig.versionName]],
        components: components,
    ]
    if (artifact != null) {
        if (!artifact.isFile()) throw new GradleException("Sealed bundle is missing: ${artifact}")
        sbom.metadata.component.hashes = [[alg: 'SHA-256',
            content: java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()]]
    }
    destination.parentFile.mkdirs()
    destination.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(sbom))
    logger.lifecycle("Wrote ${components.size()} components to ${destination}")
}

tasks.register('generateRuntimeSbom') {
    group = 'verification'
    description = 'Writes a CycloneDX inventory for the selected candidate runtime classpath.'
    dependsOn tasks.named('verifyNoJacksonRuntime')
    def outputFile = layout.buildDirectory.file('reports/security/chronicle-android-runtime.cdx.json')
    def selectedVariant = providers.gradleProperty('sbomVariant')
    inputs.property('sbomVariant', selectedVariant.orElse('all-release'))
    outputs.file(outputFile)
    doLast {
        def names = selectedVariant.isPresent() ? [selectedVariant.get() + 'RuntimeClasspath'] : releaseRuntimeClasspaths
        writeCycloneDx(outputFile.get().asFile, runtimeComponents(names))
    }
}

// Each release bundle gets the SBOM of its own runtime classpath written next to the .aab, so the
// inventory travels with the artifact that is uploaded or archived.
distributionFlavors.each { flavor ->
    def capitalized = flavor.capitalize()
    def wireNamesTask = tasks.register("verify${capitalized}ReleaseWireDtoNames", Exec) {
        group = 'verification'
        description = "Verifies reflective wire DTO names in the ${flavor} release mapping."
        dependsOn "minify${capitalized}ReleaseWithR8"
        commandLine 'bash', rootProject.file('scripts/verify-wire-dto-names.sh'),
            layout.buildDirectory.file("outputs/mapping/${flavor}Release/mapping.txt").get().asFile
    }
    tasks.matching { it.name == "assemble${capitalized}Release" || it.name == "bundle${capitalized}Release" }
        .configureEach { dependsOn(wireNamesTask) }
    def sbomTask = tasks.register("generate${capitalized}ReleaseSbom") {
        group = 'verification'
        description = "Writes the CycloneDX SBOM for the ${flavor} release beside its bundle."
        def outputFile = layout.buildDirectory.file(
            "outputs/bundle/${flavor}Release/app-${flavor}-release.cdx.json",
        )
        def bundleFile = layout.buildDirectory.file("outputs/bundle/${flavor}Release/app-${flavor}-release.aab")
        // The SBOM names the bundle's digest, so a rebuilt bundle must rerun it.
        inputs.file(bundleFile)
        outputs.file(outputFile)
        doLast {
            writeCycloneDx(outputFile.get().asFile, runtimeComponents(["${flavor}ReleaseRuntimeClasspath".toString()]),
                bundleFile.get().asFile)
        }
    }
    tasks.matching { it.name == "bundle${capitalized}Release" }.configureEach { finalizedBy(sbomTask) }
}

// sqlcipher-android's POM declares no license; app/aboutlibraries supplies its BSD-3-Clause text
// so the in-app notices (LicensesActivity) reproduce it as the license requires.
// Property form: a Groovy `collect { }` block binds to Groovy's own collect(Closure).
aboutLibraries.collect.configPath = file('aboutlibraries')

// License scan of the shipped runtime classpath against the same allowlist as server and web.
// `./gradlew :app:checkLicense` fails on any dependency whose license is not on the list.
def licenseAllowlist = rootProject.file('../config/allowed-licenses.json')
licenseReport {
    configurations = ['openReleaseRuntimeClasspath', 'amazonReleaseRuntimeClasspath']
    allowedLicensesFile = licenseAllowlist.exists() ? licenseAllowlist : rootProject.file('config/allowed-licenses.json')
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyNoGoogleSdkRuntime')
    dependsOn tasks.named('verifyNoJacksonRuntime')
    dependsOn tasks.named('verifyPublicRestrictedDependencyBoundary')
}
