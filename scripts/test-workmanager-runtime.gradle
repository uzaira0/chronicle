import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return
    gradle.rootProject.tasks.register('verifyWorkManagerRuntime') {
        doLast {
            def runtime = app.configurations.getByName('openDebugRuntimeClasspath')
                .incoming.resolutionResult.allComponents.find { component ->
                    component.id instanceof ModuleComponentIdentifier &&
                        component.id.group == 'androidx.work' && component.id.module == 'work-runtime'
                }
            assert runtime != null : 'WorkManager runtime was not resolved'
            assert runtime.id.version == app.rootProject.workManagerVersion :
                "Resolved WorkManager ${runtime.id.version} differs from the fixed runtime ${app.rootProject.workManagerVersion}"
            logger.lifecycle("Verified WorkManager runtime ${runtime.id.version}")
        }
    }
}
