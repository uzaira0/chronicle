import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.library'
}

apply from: rootProject.file('gradle/collection-library.gradle')

android {
    namespace 'com.openlattice.chronicle.collection.interaction'

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
            allWarningsAsErrors = true
        }
    }
}

dependencies {
    api project(':collection-core')

    // AndroidJUnitRunner (testInstrumentationRunner) lives in androidx.test:runner;
    // ext:junit does not bring it transitively, so the test APK can't start without it.
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
