id: android-upload-credentials-plaintext
valid:
  - 'dao.update(server.copy(apiKey = issuedKey))'
  - 'prefs.edit().putString("participant", participantId).commit()'
invalid:
  - 'prefs.edit().putString("apiKey", issuedKey).commit()'
  - 'intent.putExtra("authorization", deviceSecret)'
  - 'extras.putString("credential", pendingProposedApiKey)'
