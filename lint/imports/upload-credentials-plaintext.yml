id: android-upload-credentials-plaintext
language: kotlin
severity: error
message: Upload credentials belong in encrypted Room storage, never preferences or Intent extras.
note: >-
  Blind spots: aliased or dynamically constructed credential names, writes through helper methods,
  and source roots outside the listed production variants are not resolved; direct named setters
  containing a listed credential identifier or header are checked.
files:
  - '**/src/main/**/*.kt'
  - '**/src/research/**/*.kt'
  - '**/src/googleServices/**/*.kt'
rule:
  all:
    - kind: call_expression
    - regex: '\.(putString|putStringSet|putExtra|putStringArrayListExtra)\('
    - regex: '(apiKey|mobileSigningSecret|MOBILE_SIGNING_SECRET|deviceSecret|pendingEnrollmentAccessCode|pendingProposedApiKey|pendingEnrollmentSourceDeviceJson|X-Api-Key|Authorization|X-Chronicle-Enrollment-Code|X-Chronicle-Proposed-Api-Key|API_KEY_HEADER|ENROLLMENT_CODE_HEADER)'
